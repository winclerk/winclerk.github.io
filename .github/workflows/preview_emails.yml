name: Send preview emails

# Manual trigger only — no schedule. Click "Run workflow" on the Actions
# tab to send the four sample emails (Received / Approved / Approved with
# conditions / Denied) to lukster97@gmail.com.

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pypdf openpyxl reportlab staticmap Pillow

      - name: Run preview_emails.py
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python preview_emails.py
