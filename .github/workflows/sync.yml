name: Sync SharePoint to data.json

on:
  schedule:
    # Every hour, 8am-8pm CDT (UTC-5). 13 runs/day: 8,9,...,20 local ->
    # 13,14,...,23,0,1 UTC. NOTE: Wisconsin observes DST — this stays fixed
    # in UTC, so once CST (UTC-6) kicks in this shifts to 7am-7pm local.
    # Update to '0 14-23,0-2 * * *' in the fall (or back to this in spring)
    # to keep it pinned to 8am-8pm local, or leave it as-is if an hour of
    # drift twice a year doesn't matter.
    - cron: '0 13-23,0-1 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pypdf openpyxl reportlab staticmap Pillow

      - name: Run SharePoint sync
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GH_PAT:              ${{ secrets.GH_PAT }}
        run: python sync.py
