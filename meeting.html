<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Documents — Town Board Meetings</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="records-portal-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="topbar topbar-portal">
  <a class="portal-brand" href="index.html" aria-label="Records Portal home">
    <img src="records-portal-icon.svg" class="portal-brand-icon" alt="" width="36" height="36">
    <span class="portal-brand-text">
      <span class="portal-brand-name">Records Portal</span>
      <span class="portal-brand-sub">Town of Winchester &middot; Public Records</span>
    </span>
  </a>
  <nav class="topbar-links" aria-label="Site">
    <a class="back-link" href="index.html">&#8592; Back to portal home</a>
    <a class="town-link" href="https://winchesterwi.com">
      <img src="winchester-logo.png" class="seal-logo" alt="">
      <span class="town-link-text">winchesterwi.com</span>
    </a>
  </nav>
</div>
<div class="hero">
  <div class="hero-label" id="hero-label">Town Board Meetings</div>
  <h1 id="page-title">Meeting Documents</h1>
  <nav class="breadcrumb" aria-label="Breadcrumb" id="breadcrumb"></nav>
</div>
<div class="next-bar" id="next-bar" style="display:none;">
  <div class="next-dot"></div>
  <div class="next-text" id="next-text"></div>
</div>
<main>
  <div id="stat-tiles-container"></div>
  <div class="page-body">
    <div class="filter-bar" id="filter-bar"></div>
    <div id="meeting-docs">
      <div class="file-list" id="file-list">
        <div class="no-docs">Loading&hellip;</div>
      </div>
      <div id="subfolders-container"></div>
    </div>
  </div>
</main>
<footer>
  <span>Town of Winchester &middot; Winchester, WI 54557 &middot; (715) 686-2123</span>
  <a href="https://winchesterwi.com">winchesterwi.com &rarr;</a>
</footer>
<script src="shared.js"></script>
<script>
async function init() {
  try {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) { window.location.href = 'town-board.html'; return; }
    const data = await loadData();
    const meetings = data.meetings || [];
    const meeting = meetings.find(m => m.id === id);
    if (!meeting) { window.location.href = 'town-board.html'; return; }
    document.title = meeting.title + ' — Town Board Meetings';
    document.getElementById('page-title').textContent = meeting.title;
    const isSpecial = meeting.type === 'special';
    const backHref = isSpecial ? 'previous-special.html' : 'previous-regular.html';
    const backLabel = isSpecial ? 'Previous Special Meetings' : 'Previous Regular Meetings';
    document.getElementById('breadcrumb').innerHTML = `
      <a href="index.html">Home</a>
      <span>/</span>
      <a href="town-board.html">Town Board</a>
      <span>/</span>
      <a href="${backHref}">${backLabel}</a>
      <span>/</span>
      <span style="color:rgba(255,255,255,0.8);">${meeting.title}</span>`;
    const upcoming = meetings.find(m => m.status === 'upcoming');
    if (upcoming) {
      const parts = [upcoming.time, upcoming.location].filter(Boolean).join(' \u00b7 ');
      document.getElementById('next-text').innerHTML = `Next meeting &mdash; <strong>${formatDate(upcoming.date)}</strong>${parts ? ' \u00b7 ' + parts : ''}`;
      document.getElementById('next-bar').style.display = 'flex';
    }
    const docs = meeting.documents || [];
    const subfolders = meeting.subfolders || [];
    const totalDocsHere = docs.length + subfolders.reduce((sum, sf) => sum + (sf.documents || []).length, 0);
    document.getElementById('stat-tiles-container').innerHTML = renderStatTiles(data, totalDocsHere);
    // Recording(s) of this meeting from winchesterwi.com, shown first.
    // When two meetings share a date (e.g. the annual meeting and a special
    // board meeting), a recording only shows on the one its title matches.
    const sameDay = meetings.filter(m => m.date === meeting.date).length > 1;
    const kw = t => ['annual', 'board of review', 'special', 'regular', 'budget']
      .filter(w => (t || '').toLowerCase().includes(w));
    const recordings = getRecordings(data, r =>
      r.date === meeting.date && (r.body === 'Town Board' || r.body === 'Board of Review') &&
      (!sameDay || kw(r.title).some(w => kw(meeting.title).includes(w))));
    const folders = renderMeetingFolders(subfolders);
    document.getElementById('filter-bar').innerHTML = `
      <button class="filter-btn active" onclick="filterFiles('all', this, 'meeting-docs')">All files</button>
      <button class="filter-btn" onclick="filterFiles('agenda', this, 'meeting-docs')">Agendas</button>
      <button class="filter-btn" onclick="filterFiles('minutes', this, 'meeting-docs')">Minutes</button>
      ${recordings.length ? `<button class="filter-btn" onclick="filterFiles('recording', this, 'meeting-docs')">Recording</button>` : ''}
      ${folders.accordion ? agendaToggleAllHtml() : ''}`;
    const fileList = document.getElementById('file-list');
    if (!docs.length && !subfolders.length && !recordings.length) {
      fileList.innerHTML = '<div class="no-docs">No documents posted yet.</div>';
      return;
    }
    fileList.innerHTML =
      recordings.map(r => renderRecordingRow(Object.assign({}, r, { label: 'Meeting recording' }))).join('') +
      docs.map(doc => renderFileRow(doc)).join('');
    fileList.hidden = !docs.length && !recordings.length;
    // Numbered folders ("3. Minutes") become agenda item sections below the
    // top documents; otherwise folders (Financial, etc.) show as plain sections.
    document.getElementById('subfolders-container').innerHTML = folders.html;
  } catch (e) {
    document.getElementById('file-list').innerHTML = '<div class="error-msg">Unable to load documents. Please try again later.</div>';
  }
}
init();
</script>
</body>
</html>
